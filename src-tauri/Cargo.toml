[package]
name = "shelf-drop"
version = "0.1.0"
description = "Shelf Drop（仮称）: ファイル一時置き場＋クリップボード履歴管理アプリ"
authors = ["shiki"]
edition = "2021"
rust-version = "1.77"

# see https://v2.tauri.app/reference/config/#build
[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
# `cdylib`はモバイル向け、`staticlib`はiOS向け、`rlib`は通常のRustライブラリとして必要
name = "shelf_drop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
# F-19（自動起動）。Windows/macOS/Linuxいずれでも動作するプラグインのため、target cfgで絞り込まない。
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sha2 = "0.10.9"
image = { version = "0.25.6", default-features = false, features = ["png", "tiff"] }
arboard = "3.6.1"

# F-03（アウトバウンドドラッグ）用。Windows/macOSのみで使用し、Linux開発環境ではdev_stubを使うため
# 依存自体をtarget cfgで絞り込み、この開発コンテナのビルドに影響しないようにする（architecture.md 4.2章）
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-drag = "2"
drag = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# Win32_System_Threading: GetCurrentThreadId用（clipboard/windows.rsとdrag_watch/windows.rsの両方で使用）。
# Win32_UI_HiDpi: drag_watch/windows.rsのDPIスケール取得（GetDpiForSystem）用（F-08）。
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
