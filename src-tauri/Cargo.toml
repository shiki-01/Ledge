[package]
name = "shelf-drop"
version = "0.1.0"
description = "Shelf Drop（仮称）: ファイル一時置き場＋クリップボード履歴管理アプリ"
authors = ["shiki"]
edition = "2021"
rust-version = "1.77"

# see https://v2.tauri.app/reference/config/#build
[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
# `cdylib`はモバイル向け、`staticlib`はiOS向け、`rlib`は通常のRustライブラリとして必要
name = "shelf_drop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# F-03（アウトバウンドドラッグ）用。Windows/macOSのみで使用し、Linux開発環境ではdev_stubを使うため
# 依存自体をtarget cfgで絞り込み、この開発コンテナのビルドに影響しないようにする（architecture.md 4.2章）
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-drag = "2"
drag = "2"
